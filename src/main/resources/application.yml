    private static EmailNotifier createEmailNotifier() {
    try {
    JavaMailSenderImpl mailSender = new JavaMailSenderImpl();
    mailSender.setHost("smtp.gmail.com");
    mailSender.setPort(587);
    mailSender.setUsername(GMAIL_USERNAME);
    mailSender.setPassword(GMAIL_APP_PASSWORD);
    
    Properties props = mailSender.getJavaMailProperties();
    props.put("mail.transport.protocol", "smtp");
    props.put("mail.smtp.auth", "true");
    props.put("mail.smtp.starttls.enable", "true");
    props.put("mail.debug", "false");

  System.out.println("✅ Email configured: " + GMAIL_USERNAME + " → " + EMAIL_TO);
    
    return new EmailNotifier(mailSender, GMAIL_USERNAME, EMAIL_TO, true);
  } catch (Exception e) {
  System.err.println("⚠️ Email not configured: " + e.getMessage());
    return null;
  }
  }
  }