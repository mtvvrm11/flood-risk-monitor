    import java.util.Properties;
    
    public class Main {

    private static final String OPENWEATHER_API_KEY =
    "ed3af1fdef033267c68b17a53c30cc6c";

    private static final String TELEGRAM_BOT_TOKEN =
    "8663262102:AAHXpbGgDMZF_DLLH9HLOUheWzEuzkSLPIA";

    private static final String TELEGRAM_CHAT_ID =
    "512517261";

    // Gmail Email — ваши данные
    private static final String GMAIL_USERNAME = "ouaaey@gmail.com";
    private static final String GMAIL_APP_PASSWORD = "ваш-16-значный-пароль";
    private static final String EMAIL_TO = "mtvvrm7@gmail.com";

    public static void main(String[] args) throws Exception {
    
    System.out.println("🌊 Flood Risk Monitor — Starting Scheduler...\n");
    
    // 1. Настраиваем монитор
    FloodRiskMonitor monitor = FloodRiskMonitor.builder()
    .withApiKey(OPENWEATHER_API_KEY)
